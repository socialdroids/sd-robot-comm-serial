syntax = "proto3";
import "nanopb.proto";

message Array3D
{
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

message PowerStatus
{
  int32 voltage_mv = 1;
  int32 driver_current_ma = 2;
  int32 temperature = 3;
  int32 internal_temperature = 4;
  int32 battery_capacity = 5;
  int32 battery_percent = 6;
  bool charging = 7;
  bool charger_detected = 8;
  int32 charging_current_ma = 9;
}

message WakeUpConfig
{
  int32 hour = 1;
  int32 minutes = 2;
  optional bool sunday = 3;
  optional bool monday = 4;
  optional bool tuesday = 5;
  optional bool wednesday = 6;
  optional bool thursday = 7;
  optional bool friday = 8;
  optional bool saturday = 9;
}

message StandBy
{
  bool stand_by_connected = 1;
  bool stand_by_request = 2;
  bool stand_by_confirm = 3;
  int64 timestamp = 4;
  optional WakeUpConfig wake_up = 5;
}

message BuildInfo
{
  string commit_hash = 1 [(nanopb).max_size = 8];
  string branch_name = 2 [(nanopb).max_size = 30];
  string tag = 3 [(nanopb).max_size = 10];
  string build_date = 4 [(nanopb).max_size = 14];
}

message RobotHardware
{
  string robot_name = 1 [(nanopb).max_size = 10];
  string ecu_version = 2 [(nanopb).max_size = 10];
  string driver_version = 3 [(nanopb).max_size = 10];
  string motor_version = 4 [(nanopb).max_size = 10];
}
