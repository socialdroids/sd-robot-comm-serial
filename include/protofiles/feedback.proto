syntax = "proto3";
import "aux.proto";
import "nanopb.proto";

message PIDConfig {
  float k_p = 1;
  float k_i = 2;
  float k_d = 3;
  bool enabled = 4;
}

message IMUConfig {
  GyroscopeConfig gyro_cfg = 1;
  AccelerometerConfig acc_cfg = 2;
}

enum GyroFullScale {
  GYRO_FULL_SCALE_UNSPECIFIED = 0;
  GYRO_FULL_SCALE_2000_DPS = 1;
  GYRO_FULL_SCALE_1000_DPS = 2;
  GYRO_FULL_SCALE_500_DPS = 3;
  GYRO_FULL_SCALE_250_DPS = 4;
  GYRO_FULL_SCALE_125_DPS = 5;
  GYRO_FULL_SCALE_62_5_DPS = 6;
  GYRO_FULL_SCALE_31_25_DPS = 7;
  GYRO_FULL_SCALE_15_625_DPS = 8;
};

enum AccFullScale {
  ACC_FULL_SCALE_UNSPECIFIED = 0;
  ACC_FULL_SCALE_16_G = 1;
  ACC_FULL_SCALE_8_G = 2;
  ACC_FULL_SCALE_4_G = 3;
  ACC_FULL_SCALE_2_G = 4;
};

