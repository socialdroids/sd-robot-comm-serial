  IMU_ODR_UNSPECIFIED = 0;
  IMU_ODR_32K_LN = 1;
  IMU_ODR_16K_LN = 2;
  IMU_ODR_8K_LN = 3;
  IMU_ODR_4K_LN = 4;
  IMU_ODR_2K_LN = 5;
  IMU_ODR_1K_LN = 6;
  IMU_ODR_200 = 7;
  IMU_ODR_100 = 8;
  IMU_ODR_50 = 9;
  IMU_ODR_25 = 10;
  IMU_ODR_12_5 = 11;
  IMU_ODR_6_25_LP_ACC_ONLY = 12;
  IMU_ODR_3_125_LP_ACC_ONLY = 13;
  IMU_ODR_1_5625_LP_ACC_ONLY = 14;
  IMU_ODR_500 = 15;
}

