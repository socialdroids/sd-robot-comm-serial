syntax = "proto3";
import "nanopb.proto";

message PIDConfig
{
  sint32 k_p = 1;
  sint32 k_i = 2;
  sint32 k_d = 3;
}

message RobotParameters
{
  optional PIDConfig left_wheel = 1;
  optional PIDConfig right_wheel = 2;
}

enum BumperID {
  BUMPER_ID_UNSPECIFIED = 0;
  BUMPER_ID_BUMPER_A = 1;
  BUMPER_ID_BUMPER_B = 2;
  BUMPER_ID_BUMPER_C = 3;
  BUMPER_ID_BUMPER_D = 4;
  BUMPER_ID_BUMPER_E = 5;
  BUMPER_ID_BUMPER_F = 6;
}

message Bumper
{
  bool status = 1;
  BumperID id = 2;
}

message Pose
{
  sint64 x_mm = 1;
  sint64 y_mm = 2;
  sint32 yaw_trad = 3;
  // Inserir covariância
}

message Velocities
{
  sint32 linear_mm_s = 1;
  sint32 angular_trad_s = 2;
  // Inserir covariância

  sint32 left_wheel_mm_s = 3;
  sint32 right_wheel_mm_s = 4;
}

message Array3D
{
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

message IMU
{
  Array3D acc = 1;
  Array3D gyro = 2;
  int32 temperature = 3;
}

message Encoder
{
  sint64 left = 1;
  sint64 right = 2;
  optional EncoderStatus left_status = 3;
  optional EncoderStatus right_status = 4;
}

message EncoderStatus
{
  int32 magnitude = 1;
  int32 gain = 2;
  bool connected = 3;
  bool magnet_detected = 4;
  bool magnet_weak = 5;
  bool magnet_strong = 6;
  int32 ppr = 7;
}

message PowerStatus
{
  int32 voltage_mv = 1;
  int32 driver_current_ma = 2;
  int32 temperature = 3;
  int32 battery_capacity = 4;
  int32 battery_percent = 5;
  bool charging = 6;
  bool charger_detected = 7;
  int32 charging_current_ma = 8;
}

message WakeUpConfig
{
  int32 hour = 1;
  int32 minutes = 2;
  optional bool sunday = 3;
  optional bool monday = 4;
  optional bool tuesday = 5;
  optional bool wednesday = 6;
  optional bool thursday = 7;
  optional bool friday = 8;
  optional bool saturday = 9;
}

message StandBy
{
  bool stand_by_connected = 1;
  bool stand_by_request = 2;
  bool stand_by_confirm = 3;
  optional WakeUpConfig wake_up = 4;
}

message BuildInfo
{
  string commit_hash = 1 [(nanopb).max_size = 8];
  string branch_name = 2 [(nanopb).max_size = 30];
  string tag = 3 [(nanopb).max_size = 10];
  string build_date = 4 [(nanopb).max_size = 14];
}

message RobotHardware
{
  string robot_name = 1 [(nanopb).max_size = 10];
  string ecu_version = 2 [(nanopb).max_size = 10];
  string driver_version = 3 [(nanopb).max_size = 10];
  string motor_version = 4 [(nanopb).max_size = 10];
}

message RobotInfo
{
  RobotHardware hardware_info = 1;
  int32 wheel_distance_mm = 2;
  int32 wheel_diameter_mm = 3;
  optional string debug_data = 4 [(nanopb).max_size = 500];
  optional BuildInfo build_data = 5;
  optional BuildInfo power_build_data = 6;
}

message FeedbackMessage
{
  repeated Bumper bumpers = 1 [(nanopb).max_count = 6];

  Pose pose = 2;
  Velocities velocities = 3;
  Encoder encoder = 4;
  IMU imu = 5;

  bool emergency_button_pressed = 6;
  bool colision_detected = 7;

  PowerStatus power_status = 8;
  StandBy stand_by = 9;

  optional RobotParameters parameters = 10;
  optional RobotInfo info = 11;

  // true sempre que um comando opcional for recebido e foi corretamente
  // reconhecido. Comandos opcionais: RobotActions, RobotConfig, RobotState,
  // WakeUpConfig, timestamp
  optional bool last_command_ok = 12;
}
