//      ODR (Hz) | *_UI_FILT_BW | 3dB BW (Hz) | NBW (Hz) | Group Delay (ms)  
// 1st  200      | 3            | 44.4        | 50.6     | 6.8              
// 2st  200      | 3            | 47.0        | 49.1     | 8.0              
// 3st  200      | 3            | 47.6        | 48.1     | 9.8              
// ----------------------------------------------------------               
// 1st  200      | 4            | 37.0        | 43.6     | 7.6              
// 2st  200      | 4            | 37.8        | 41.2     | 9.1              
// 3st  200      | 4            | 39.2        | 40.0     | 11.4             
// ----------------------------------------------------------               
// 1st  200      | 6            | 19.5        | 25.7     | 11.7
// 2st  200      | 6            | 19.2        | 21.0     | 15.3              
// 3st  200      | 6            | 18.7        | 19.5     | 20.4
// ----------------------------------------------------------               
// 1st  200      | 7            |  9.6        | 13.7     | 20.3
// 2st  200      | 7            |  8.5        |  9.5     | 30.0              
// 3st  200      | 7            | 10.1        | 10.6     | 35.2
enum ImuUIFilterOrder {
  IMU_UI_FILTER_ORDER_UNSPECIFIED = 0;
  IMU_UI_FILTER_ORDER_1 = 1;
  IMU_UI_FILTER_ORDER_2 = 2;
  IMU_UI_FILTER_ORDER_3 = 3;
}

message GyroscopeConfig {
  float dead_zone = 1;
  float motion_threshold = 2;

  GyroFullScale full_scale = 3;
  ImuOdr odr = 4;
  Array3D bias = 5;

  optional GyroNotchBandwidth notch_bw = 6;
  AAFBandwidth aaf_bw = 7;
  ImuUIFilterOrder ui_order = 8;
  float ui_filter_bw = 9;
}

message AccelerometerConfig {
  float motion_threshold = 1;

  AccFullScale full_scale = 2;
  ImuOdr odr = 3;
  Array3D bias = 4;

  AAFBandwidth aaf_bw = 5;
  ImuUIFilterOrder ui_order = 6;
  float ui_filter_bw = 7;
}

message RobotParameters
{
  optional PIDConfig left_pid = 1;
  optional PIDConfig right_pid = 2;
  optional PIDConfig linear_pid = 3;
  optional PIDConfig angular_pid = 4;
  optional float wheel_diameter = 5;
  optional float wheel_distance = 6;
  optional IMUConfig imu_config = 7;
}

enum BumperID {
  BUMPER_ID_UNSPECIFIED = 0;
  BUMPER_ID_BUMPER_A = 1;
  BUMPER_ID_BUMPER_B = 2;
  BUMPER_ID_BUMPER_C = 3;
  BUMPER_ID_BUMPER_D = 4;
  BUMPER_ID_BUMPER_E = 5;
  BUMPER_ID_BUMPER_F = 6;
}

message Bumper
{
  bool status = 1;
  BumperID id = 2;
}

message Pose
{
  sint64 x_mm = 1;
  sint64 y_mm = 2;
  sint32 yaw_trad = 3;
  repeated double covariance = 4 [(nanopb).max_count = 36];
}

message Velocities
{
  sint32 linear_mm_s = 1;
  sint32 angular_trad_s = 2;
  repeated double covariance = 3 [(nanopb).max_count = 36];

  sint32 left_wheel_mm_s = 4;
  sint32 right_wheel_mm_s = 5;
}

message IMU
{
  Array3D acc = 1;
  Array3D gyro = 2;
  float temperature = 3;
  Angle angle = 4;
  uint64 timestamp = 5;
  bool linear_motion_detected = 6;
  bool angular_motion_detected = 7;
}

message Encoder
{
  sint64 left_count = 1;
  sint64 right_count = 2;
  float left_pos = 3;
  float right_pos = 4;
  optional EncoderStatus left_status = 5;
  optional EncoderStatus right_status = 6;
  Pose pose_enc = 7;
  Velocities twist_enc = 8;

}

message EncoderStatus
{
  int32 magnitude = 1;
  int32 gain = 2;
  bool connected = 3;
  bool magnet_detected = 4;
  bool magnet_weak = 5;
  bool magnet_strong = 6;
  int32 ppr = 7;
}

message RTOSTaskData
{
  string name = 1 [(nanopb).max_size = 20];
  int32 id = 2;
  int32 state = 3;
  float usage = 4;
  int32 stack_free = 5;
  float update_rate = 6;
}

message RTOSData
{
  repeated RTOSTaskData task_info = 1 [(nanopb).max_count = 20];
}

message RobotInfo
{
  RobotHardware hardware_info = 1;
  int32 wheel_distance_mm = 2;
  int32 wheel_diameter_mm = 3;
  optional string debug_data = 4 [(nanopb).max_size = 500];
  optional BuildInfo build_data = 5;
  optional BuildInfo power_build_data = 6;
  RTOSData rtos_tasks = 7;
}

message FeedbackMessage
{
  repeated Bumper bumpers = 1 [(nanopb).max_count = 6];

  Pose pose = 2;
  Velocities velocities = 3;
  Encoder encoder = 4;
  IMU imu = 5;

  bool emergency_button_pressed = 6;
  bool colision_detected = 7;

  PowerStatus power_status = 8;
  StandBy stand_by = 9;

  optional RobotParameters parameters = 10;
  optional RobotInfo info = 11;

  // true sempre que um comando opcional for recebido e foi corretamente
  // reconhecido. Comandos opcionais: RobotActions, RobotConfig, RobotState,
  // WakeUpConfig, timestamp
  optional bool last_command_ok = 12;

  optional TimeSync sync = 13;
}
