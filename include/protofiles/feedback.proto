syntax = "proto3";
// import "nanopb.proto";

enum BumperID {
  BUMPER_A = 0;
  BUMPER_B = 1;
  BUMPER_C = 2;
  BUMPER_D = 3;
  BUMPER_E = 4;
  BUMPER_F = 5;
  BUMPER_UNDEFINED = -1;
}

message Bumper
{
  bool status = 1;
  BumperID id = 2;
}

message Pose
{
  sint64 x = 1;
  sint64 y = 2;
  sint64 z = 3;
  sint32 roll = 4;
  sint32 pitch = 5;
  sint32 yaw = 6;
}

message FeedbackMessage
{
  repeated Bumper bumpers = 1;// [(nanopb).max_count = 6];
  Pose pose = 2;
}
